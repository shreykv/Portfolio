<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Personal Access — Shrey Vasisht</title>
  <meta name="description" content="Personal access page with mini sites" />
  <link rel="stylesheet" href="css/personal.css" />
  <style>
    :root{
      --bg:#070A10;
      --panel: rgba(255,255,255,.06);
      --panel2: rgba(255,255,255,.09);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.68);
      --muted2: rgba(255,255,255,.52);
      --border: rgba(255,255,255,.12);
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --accent: #6EE7FF;
      --accent2:#A78BFA;
      --ok:#22c55e;
      --warn:#f59e0b;
      --danger:#ef4444;
      --radius: 18px;
      --radius2: 26px;
      --max: 1120px;
      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:var(--font);
      background: radial-gradient(1200px 800px at 20% 10%, rgba(110,231,255,.08), transparent 55%),
                  radial-gradient(900px 700px at 80% 35%, rgba(167,139,250,.10), transparent 55%),
                  radial-gradient(900px 700px at 55% 95%, rgba(110,231,255,.05), transparent 55%),
                  var(--bg);
      color:var(--text);
      overflow-x:hidden;
    }
    a{color:inherit; text-decoration:none}
    .btn{
      display:inline-flex; align-items:center; gap:10px;
      padding:12px 14px; border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.06));
      box-shadow: var(--shadow);
      color:var(--text);
      transition:.18s ease;
      cursor:pointer;
      user-select:none;
      font-family:var(--font);
      font-size:14px;
    }
    .btn:hover{transform: translateY(-1px); border-color: rgba(255,255,255,.22)}
    .btn.primary{
      border:none;
      background: linear-gradient(135deg, rgba(110,231,255,.95), rgba(167,139,250,.95));
      color:#071018;
      font-weight:700;
    }
    .btn.primary:hover{filter:saturate(1.05) brightness(1.02)}
  </style>
</head>
<body>
  <!-- Password Modal -->
  <div id="password-modal" class="password-modal" style="display: none;">
    <div class="password-modal-content">
      <h2>Personal Access</h2>
      <p>This area is password protected. Please enter the password to continue.</p>
      <form id="password-form">
        <div class="password-input-group">
          <input type="password" id="password-input" placeholder="Enter password" required autofocus>
          <button type="submit" class="btn primary">Enter</button>
        </div>
        <div id="password-error" class="password-error"></div>
      </form>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="personal-nav">
    <div class="personal-nav-inner">
      <a href="/" class="brand" style="display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.2px;">
        <div class="logo" style="width:34px; height:34px; border-radius:12px; background: linear-gradient(135deg, rgba(110,231,255,.9), rgba(167,139,250,.9)); box-shadow: 0 10px 24px rgba(110,231,255,.12);"></div>
        <span>Shrey Vasisht</span>
      </a>
      <div class="personal-nav-links">
        <a href="#" data-route="#/personal/gym-log" id="nav-gym-log">Gym Log</a>
        <a href="#" data-route="#/personal/tournament" id="nav-tournament">Tournament</a>
        <a href="#" data-route="#/personal/counter" id="nav-counter">Counter</a>
        <a href="/" class="btn">Back to Portfolio</a>
        <button class="btn" onclick="auth.logout(); window.location.href='/personal';">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="personal-container">
    <div class="personal-content">
      <div id="app-content">
        <!-- Content will be dynamically loaded here -->
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/router.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/gym-log.js"></script>
  <script src="js/tournament.js"></script>
  <script src="js/counter.js"></script>
  <script>
    // Initialize authentication check
    const passwordModal = document.getElementById('password-modal');
    const passwordForm = document.getElementById('password-form');
    const passwordInput = document.getElementById('password-input');
    const passwordError = document.getElementById('password-error');

    // Check authentication on load
    if (!auth.isAuthenticated()) {
      passwordModal.style.display = 'flex';
    } else {
      initializeApp();
    }

    // Handle password form submission
    passwordForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const password = passwordInput.value;
      const result = auth.authenticate(password);

      if (result.success) {
        passwordModal.style.display = 'none';
        passwordInput.value = '';
        passwordError.classList.remove('show');
        initializeApp();
      } else {
        passwordError.textContent = result.error;
        passwordError.classList.add('show');
        passwordInput.value = '';
      }
    });

    // Check for lockout
    const lockout = auth.isLockedOut();
    if (lockout && typeof lockout === 'object' && lockout.locked) {
      passwordError.textContent = `Account locked. Try again in ${lockout.minutes} minute(s).`;
      passwordError.classList.add('show');
      passwordInput.disabled = true;
      document.querySelector('#password-form button').disabled = true;
    }

    // Initialize app after authentication
    function initializeApp() {
      // Register routes (using hash-based routing)
      router.register('/personal', () => {
        // Default route - redirect to gym log
        router.navigate('#/personal/gym-log', true);
      });

      router.register('/personal/gym-log', () => {
        document.getElementById('app-content').innerHTML = '<div id="gym-log-content"></div>';
        updateActiveNav('nav-gym-log');
        gymLog.render();
      });

      router.register('/personal/tournament', () => {
        document.getElementById('app-content').innerHTML = '<div id="tournament-content"></div>';
        updateActiveNav('nav-tournament');
        tournament.render();
      });

      router.register('/personal/counter', () => {
        document.getElementById('app-content').innerHTML = '<div id="counter-content"></div>';
        updateActiveNav('nav-counter');
        counter.render();
      });

      // Handle direct access to personal.html (no hash)
      if (!window.location.hash && window.location.pathname.includes('personal')) {
        router.navigate('#/personal/gym-log', true);
      }

      router.setNotFound(() => {
        document.getElementById('app-content').innerHTML = `
          <div style="text-align:center; padding:60px 20px;">
            <h2>404 - Page Not Found</h2>
            <p style="color:var(--muted); margin:16px 0 24px;">The page you're looking for doesn't exist.</p>
            <a href="#" data-route="#/personal/gym-log" class="btn primary">Go to Gym Log</a>
          </div>
        `;
      });

      // Handle initial route
      router.handleRoute();
    }

    // Update active navigation
    function updateActiveNav(activeId) {
      document.querySelectorAll('.personal-nav-links a').forEach(link => {
        link.classList.remove('active');
      });
      const activeLink = document.getElementById(activeId);
      if (activeLink) {
        activeLink.classList.add('active');
      }
    }

    // Make router and auth available globally for onclick handlers
    window.router = router;
    window.auth = auth;
    window.gymLog = gymLog;
    window.tournament = tournament;
    window.counter = counter;
  </script>
</body>
</html>
