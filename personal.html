<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Personal Access — Shrey Vasisht</title>
  <meta name="description" content="Personal access page with mini sites" />
  <link rel="stylesheet" href="css/personal.css" />
  <style>
    :root{
      --bg:#070A10;
      --panel: rgba(255,255,255,.06);
      --panel2: rgba(255,255,255,.09);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.68);
      --muted2: rgba(255,255,255,.52);
      --border: rgba(255,255,255,.12);
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --accent: #6EE7FF;
      --accent2:#A78BFA;
      --ok:#22c55e;
      --warn:#f59e0b;
      --danger:#ef4444;
      --radius: 18px;
      --radius2: 26px;
      --max: 1120px;
      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;color-scheme:dark}
    body{
      margin:0;
      font-family:var(--font);
      background: radial-gradient(1200px 800px at 20% 10%, rgba(110,231,255,.08), transparent 55%),
                  radial-gradient(900px 700px at 80% 35%, rgba(167,139,250,.10), transparent 55%),
                  radial-gradient(900px 700px at 55% 95%, rgba(110,231,255,.05), transparent 55%),
                  var(--bg);
      color:var(--text);
      overflow-x:hidden;
    }
    a{color:inherit; text-decoration:none}
    .btn{
      display:inline-flex; align-items:center; gap:10px;
      padding:12px 14px; border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.06));
      box-shadow: var(--shadow);
      color:var(--text);
      transition:.18s ease;
      cursor:pointer;
      user-select:none;
      font-family:var(--font);
      font-size:14px;
    }
    .btn:hover{transform: translateY(-1px); border-color: rgba(255,255,255,.22)}
    .btn.primary{
      border:none;
      background: linear-gradient(135deg, rgba(110,231,255,.95), rgba(167,139,250,.95));
      color:#071018;
      font-weight:700;
    }
    .btn.primary:hover{filter:saturate(1.05) brightness(1.02)}
    .btn.secondary{
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
    }
    .btn:disabled{opacity:0.5; cursor: not-allowed; transform: none;}
    
    /* Auth Modal Styles */
    .auth-modal{
      position:fixed; inset:0; z-index:1000;
      background: rgba(7,10,16,.95);
      backdrop-filter: blur(20px);
      display:flex; align-items:center; justify-content:center;
      padding: 20px;
    }
    .auth-modal-content{
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      border: 1px solid rgba(255,255,255,.12);
      border-radius: var(--radius2);
      padding: 40px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .auth-modal-content h2{
      margin: 0 0 8px 0;
      font-size: 1.8rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .auth-modal-content p{
      margin: 0 0 24px 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .auth-tabs{
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .auth-tab{
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: var(--font);
      font-size: 14px;
      cursor: pointer;
      border-radius: 10px;
      transition: 0.2s;
    }
    .auth-tab:hover{ color: var(--text); }
    .auth-tab.active{
      background: var(--panel2);
      color: var(--text);
    }
    .auth-form{
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .auth-form .form-group{
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .auth-form label{
      font-size: 0.85rem;
      color: var(--muted);
    }
    .auth-form input{
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.05);
      color: var(--text);
      font-family: var(--font);
      font-size: 1rem;
      transition: 0.2s;
    }
    .auth-form input:focus{
      outline: none;
      border-color: var(--accent);
      background: rgba(255,255,255,.08);
    }
    .auth-form input::placeholder{
      color: var(--muted2);
    }
    .auth-error{
      padding: 12px;
      border-radius: 10px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      font-size: 0.9rem;
      display: none;
    }
    .auth-error.show{ display: block; }
    .auth-success{
      padding: 12px;
      border-radius: 10px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
      font-size: 0.9rem;
      display: none;
    }
    .auth-success.show{ display: block; }
    .auth-link{
      color: var(--accent);
      cursor: pointer;
      font-size: 0.9rem;
      text-align: center;
      margin-top: 8px;
    }
    .auth-link:hover{ text-decoration: underline; }
    .auth-divider{
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
      color: var(--muted2);
      font-size: 0.85rem;
    }
    .auth-divider::before,
    .auth-divider::after{
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    
    /* Sync indicator */
    .sync-indicator{
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px 16px;
      border-radius: 10px;
      background: var(--panel2);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 100;
      animation: slideIn 0.3s ease;
    }
    .sync-indicator.success{ border-color: var(--ok); color: var(--ok); }
    .sync-indicator.error{ border-color: var(--danger); color: var(--danger); }
    @keyframes slideIn{
      from{ transform: translateY(20px); opacity: 0; }
      to{ transform: translateY(0); opacity: 1; }
    }
    
    /* User info badge */
    .user-badge{
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 10px;
      background: var(--panel);
      font-size: 0.85rem;
      color: var(--muted);
    }
    .user-badge .user-email{
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <!-- Auth Modal (Sign In / Sign Up) -->
  <div id="auth-modal" class="auth-modal" style="display: none;">
    <div class="auth-modal-content">
      <h2>Personal Access</h2>
      <p>Sign in to sync your data across all devices.</p>
      
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-signin" onclick="showAuthTab('signin')">Sign In</button>
        <button class="auth-tab" id="tab-signup" onclick="showAuthTab('signup')">Sign Up</button>
      </div>
      
      <!-- Sign In Form -->
      <form id="signin-form" class="auth-form">
        <div class="form-group">
          <label for="signin-email">Email</label>
          <input type="email" id="signin-email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="signin-password">Password</label>
          <input type="password" id="signin-password" placeholder="Your password" required>
        </div>
        <div id="signin-error" class="auth-error"></div>
        <button type="submit" class="btn primary" style="width:100%; justify-content:center;">Sign In</button>
        <div class="auth-link" onclick="showResetPassword()">Forgot password?</div>
      </form>
      
      <!-- Sign Up Form -->
      <form id="signup-form" class="auth-form" style="display: none;">
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" placeholder="Create a password (min 6 characters)" minlength="6" required>
        </div>
        <div class="form-group">
          <label for="signup-password-confirm">Confirm Password</label>
          <input type="password" id="signup-password-confirm" placeholder="Confirm your password" minlength="6" required>
        </div>
        <div id="signup-error" class="auth-error"></div>
        <div id="signup-success" class="auth-success"></div>
        <button type="submit" class="btn primary" style="width:100%; justify-content:center;">Create Account</button>
      </form>
      
      <!-- Reset Password Form -->
      <form id="reset-form" class="auth-form" style="display: none;">
        <div class="form-group">
          <label for="reset-email">Email</label>
          <input type="email" id="reset-email" placeholder="you@example.com" required>
        </div>
        <div id="reset-error" class="auth-error"></div>
        <div id="reset-success" class="auth-success"></div>
        <button type="submit" class="btn primary" style="width:100%; justify-content:center;">Send Reset Link</button>
        <div class="auth-link" onclick="showAuthTab('signin')">← Back to Sign In</div>
      </form>
      
      <!-- Legacy Password Form (fallback when Supabase not configured) -->
      <div id="legacy-notice" style="display: none; margin-top: 16px; padding: 12px; background: var(--panel); border-radius: 10px; font-size: 0.85rem; color: var(--muted);">
        <strong>Note:</strong> Cloud sync not configured. Data will be stored locally only.
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="personal-nav">
    <div class="personal-nav-inner">
      <a href="/" class="brand" style="display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.2px;">
        <div class="logo" style="width:34px; height:34px; border-radius:12px; background: linear-gradient(135deg, rgba(110,231,255,.9), rgba(167,139,250,.9)); box-shadow: 0 10px 24px rgba(110,231,255,.12);"></div>
        <span>Shrey Vasisht</span>
      </a>
      <div class="personal-nav-links">
        <a href="#" data-route="#/personal" id="nav-personal-home">Overview</a>
        <a href="#" data-route="#/personal/gym-log" id="nav-gym-log">Gym Log</a>
        <a href="#" data-route="#/personal/tournament" id="nav-tournament">Tournament</a>
        <a href="#" data-route="#/personal/counter" id="nav-counter">Counter</a>
        <a href="#" data-route="#/personal/focus-timer" id="nav-focus-timer">Focus Timer</a>
        <a href="#" data-route="#/personal/screener" id="nav-screener">Screener</a>
        <a href="/" class="btn">Back to Portfolio</a>
        <span id="user-badge" class="user-badge" style="display:none;">
          <span class="user-email"></span>
        </span>
        <button class="btn" id="logout-btn" onclick="handleLogout()">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="personal-container">
    <div class="personal-content">
      <div id="app-content">
        <!-- Content will be dynamically loaded here -->
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <!-- Supabase JS Library (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  
  <!-- App Scripts -->
  <script src="js/supabase-config.js"></script>
  <script src="js/router.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/gym-log.js"></script>
  <script src="js/tournament.js"></script>
  <script src="js/counter.js"></script>
  <script src="js/focus-timer.js"></script>
  <script src="js/migrate-data.js"></script>
  <script src="js/screener-performance.js"></script>
  <script src="js/screener.js"></script>
  
  <script>
    // ==========================================================================
    // Auth UI Management
    // ==========================================================================
    
    const authModal = document.getElementById('auth-modal');
    const signinForm = document.getElementById('signin-form');
    const signupForm = document.getElementById('signup-form');
    const resetForm = document.getElementById('reset-form');
    const signinError = document.getElementById('signin-error');
    const signupError = document.getElementById('signup-error');
    const signupSuccess = document.getElementById('signup-success');
    const resetError = document.getElementById('reset-error');
    const resetSuccess = document.getElementById('reset-success');
    const legacyNotice = document.getElementById('legacy-notice');
    const userBadge = document.getElementById('user-badge');
    
    function showAuthTab(tab) {
      // Reset error/success messages
      [signinError, signupError, signupSuccess, resetError, resetSuccess].forEach(el => {
        el.classList.remove('show');
      });
      
      // Hide all forms
      signinForm.style.display = 'none';
      signupForm.style.display = 'none';
      resetForm.style.display = 'none';
      
      // Update tabs
      document.getElementById('tab-signin').classList.remove('active');
      document.getElementById('tab-signup').classList.remove('active');
      
      if (tab === 'signin') {
        signinForm.style.display = 'flex';
        document.getElementById('tab-signin').classList.add('active');
        document.querySelector('.auth-tabs').style.display = 'flex';
      } else if (tab === 'signup') {
        signupForm.style.display = 'flex';
        document.getElementById('tab-signup').classList.add('active');
        document.querySelector('.auth-tabs').style.display = 'flex';
      }
    }
    
    function showResetPassword() {
      signinForm.style.display = 'none';
      signupForm.style.display = 'none';
      resetForm.style.display = 'flex';
      document.querySelector('.auth-tabs').style.display = 'none';
    }
    
    function showError(element, message) {
      element.textContent = message;
      element.classList.add('show');
    }
    
    function showSuccess(element, message) {
      element.textContent = message;
      element.classList.add('show');
    }
    
    function updateUserBadge() {
      const user = auth.currentUser;
      if (user && user.email) {
        userBadge.style.display = 'flex';
        userBadge.querySelector('.user-email').textContent = user.email;
      } else {
        userBadge.style.display = 'none';
      }
    }
    
    // ==========================================================================
    // Form Handlers
    // ==========================================================================
    
    signinForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      signinError.classList.remove('show');
      
      const email = document.getElementById('signin-email').value;
      const password = document.getElementById('signin-password').value;
      const submitBtn = signinForm.querySelector('button[type="submit"]');
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';
      
      try {
        const result = await auth.signIn(email, password);
        
        if (result.success) {
          authModal.style.display = 'none';
          updateUserBadge();
          initializeApp();
        } else {
          showError(signinError, result.error);
        }
      } catch (error) {
        showError(signinError, 'An unexpected error occurred. Please try again.');
      }
      
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
    });
    
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      signupError.classList.remove('show');
      signupSuccess.classList.remove('show');
      
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const confirmPassword = document.getElementById('signup-password-confirm').value;
      const submitBtn = signupForm.querySelector('button[type="submit"]');
      
      if (password !== confirmPassword) {
        showError(signupError, 'Passwords do not match.');
        return;
      }
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';
      
      try {
        const result = await auth.signUp(email, password);
        
        if (result.success) {
          if (result.requiresConfirmation) {
            showSuccess(signupSuccess, result.message);
          } else {
            authModal.style.display = 'none';
            updateUserBadge();
            initializeApp();
          }
        } else {
          showError(signupError, result.error);
        }
      } catch (error) {
        showError(signupError, 'An unexpected error occurred. Please try again.');
      }
      
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create Account';
    });
    
    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      resetError.classList.remove('show');
      resetSuccess.classList.remove('show');
      
      const email = document.getElementById('reset-email').value;
      const submitBtn = resetForm.querySelector('button[type="submit"]');
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
      
      try {
        const result = await auth.resetPassword(email);
        
        if (result.success) {
          showSuccess(resetSuccess, result.message);
        } else {
          showError(resetError, result.error);
        }
      } catch (error) {
        showError(resetError, 'An unexpected error occurred. Please try again.');
      }
      
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send Reset Link';
    });
    
    async function handleLogout() {
      await auth.signOut();
      userBadge.style.display = 'none';
      authModal.style.display = 'flex';
      showAuthTab('signin');
    }
    
    // ==========================================================================
    // Initialize App
    // ==========================================================================
    
    async function checkAuthAndInit() {
      // Wait for Supabase to initialize
      await new Promise(resolve => setTimeout(resolve, 100));
      
      // Initialize Supabase if not already done
      if (window.initSupabase) {
        window.initSupabase();
      }
      
      // Re-initialize auth listener now that Supabase client exists
      // (the initial call in the Auth constructor runs before initSupabase)
      await auth.initAuthListener();
      
      const isAuthenticated = await auth.isAuthenticated();
      
      if (!isAuthenticated) {
        authModal.style.display = 'flex';
        
        // Show legacy notice if Supabase is not configured
        if (!auth.isSupabaseEnabled()) {
          legacyNotice.style.display = 'block';
        }
      } else {
        authModal.style.display = 'none';
        updateUserBadge();

        // Clean up legacy localStorage data keys now that Supabase is the source of truth
        if (auth.isSupabaseEnabled()) {
          const legacyKeys = ['gym-log', 'tournaments', 'counters', 'habits', 'tasks', 'focus-timer', 'gym-log-templates'];
          legacyKeys.forEach(key => localStorage.removeItem(key));
        }

        initializeApp();
      }
      
      // Check for lockout
      const lockout = auth.isLockedOut();
      if (lockout && typeof lockout === 'object' && lockout.locked) {
        showError(signinError, `Account locked. Try again in ${lockout.minutes} minute(s).`);
        signinForm.querySelector('button[type="submit"]').disabled = true;
      }
    }
    
    // Check auth on page load
    document.addEventListener('DOMContentLoaded', checkAuthAndInit);

    // Initialize app after authentication
    function initializeApp() {
      // Register routes (using hash-based routing)
      router.register('/personal', async () => {
        const appContent = document.getElementById('app-content');
        
        // Load data from all mini sites for dashboard stats
        const dashboardStats = await loadDashboardStats();
        
        appContent.innerHTML = `
          <section class="personal-landing">
            <header class="personal-landing-header">
              <h1>Personal Dashboard</h1>
              <p>Your productivity hub at a glance${auth.isSupabaseEnabled() ? ' — synced across devices' : ''}</p>
            </header>
            
            <!-- Sync Status -->
            ${auth.isSupabaseEnabled() ? `
              <div style="margin-bottom: 20px; padding: 12px 16px; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); border-radius: 12px; display: flex; align-items: center; gap: 10px;">
                <span style="color: var(--ok);">☁️</span>
                <span style="color: var(--ok); font-size: 0.9rem;">Cloud sync enabled — your data is available on all devices</span>
              </div>
            ` : `
              <div style="margin-bottom: 20px; padding: 12px 16px; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 12px; display: flex; align-items: center; gap: 10px;">
                <span style="color: var(--warn);">💾</span>
                <span style="color: var(--warn); font-size: 0.9rem;">Local storage mode — data is stored on this device only</span>
              </div>
            `}
            
            <!-- Quick Stats Overview -->
            <div class="dashboard-overview">
              <div class="dashboard-stats-row">
                ${dashboardStats.gymLog.totalWorkouts > 0 ? `
                  <div class="dashboard-stat-card gym-stat" onclick="router.navigate('#/personal/gym-log')">
                    <div class="stat-icon">🏋️</div>
                    <div class="stat-info">
                      <span class="stat-number">${dashboardStats.gymLog.totalWorkouts}</span>
                      <span class="stat-label">Workouts</span>
                    </div>
                    <div class="stat-detail">
                      ${dashboardStats.gymLog.thisWeek > 0 ? `<span class="stat-highlight">${dashboardStats.gymLog.thisWeek} this week</span>` : '<span class="stat-muted">Start today!</span>'}
                    </div>
                  </div>
                ` : `
                  <div class="dashboard-stat-card gym-stat empty" onclick="router.navigate('#/personal/gym-log')">
                    <div class="stat-icon">🏋️</div>
                    <div class="stat-info">
                      <span class="stat-number">0</span>
                      <span class="stat-label">Workouts</span>
                    </div>
                    <div class="stat-detail"><span class="stat-muted">Start logging!</span></div>
                  </div>
                `}
                
                ${dashboardStats.focusTimer.totalSessions > 0 ? `
                  <div class="dashboard-stat-card focus-stat" onclick="router.navigate('#/personal/focus-timer')">
                    <div class="stat-icon">⏱️</div>
                    <div class="stat-info">
                      <span class="stat-number">${dashboardStats.focusTimer.todayFormatted}</span>
                      <span class="stat-label">Focus Today</span>
                    </div>
                    <div class="stat-detail">
                      <span class="stat-highlight">${dashboardStats.focusTimer.activeTasks} active tasks</span>
                    </div>
                  </div>
                ` : `
                  <div class="dashboard-stat-card focus-stat empty" onclick="router.navigate('#/personal/focus-timer')">
                    <div class="stat-icon">⏱️</div>
                    <div class="stat-info">
                      <span class="stat-number">0m</span>
                      <span class="stat-label">Focus Today</span>
                    </div>
                    <div class="stat-detail"><span class="stat-muted">Start focusing!</span></div>
                  </div>
                `}
                
                ${dashboardStats.counters.total > 0 ? `
                  <div class="dashboard-stat-card counter-stat" onclick="router.navigate('#/personal/counter')">
                    <div class="stat-icon">🔢</div>
                    <div class="stat-info">
                      <span class="stat-number">${dashboardStats.counters.total}</span>
                      <span class="stat-label">Counters</span>
                    </div>
                    <div class="stat-detail">
                      ${dashboardStats.counters.goalsCompleted > 0 ? `<span class="stat-highlight">${dashboardStats.counters.goalsCompleted} goals hit! 🎉</span>` : '<span class="stat-muted">Keep counting!</span>'}
                    </div>
                  </div>
                ` : `
                  <div class="dashboard-stat-card counter-stat empty" onclick="router.navigate('#/personal/counter')">
                    <div class="stat-icon">🔢</div>
                    <div class="stat-info">
                      <span class="stat-number">0</span>
                      <span class="stat-label">Counters</span>
                    </div>
                    <div class="stat-detail"><span class="stat-muted">Create one!</span></div>
                  </div>
                `}
                
                ${dashboardStats.tournaments.total > 0 ? `
                  <div class="dashboard-stat-card tournament-stat" onclick="router.navigate('#/personal/tournament')">
                    <div class="stat-icon">🏆</div>
                    <div class="stat-info">
                      <span class="stat-number">${dashboardStats.tournaments.total}</span>
                      <span class="stat-label">Tournaments</span>
                    </div>
                    <div class="stat-detail">
                      ${dashboardStats.tournaments.inProgress > 0 ? `<span class="stat-highlight">${dashboardStats.tournaments.inProgress} in progress</span>` : '<span class="stat-muted">All completed!</span>'}
                    </div>
                  </div>
                ` : `
                  <div class="dashboard-stat-card tournament-stat empty" onclick="router.navigate('#/personal/tournament')">
                    <div class="stat-icon">🏆</div>
                    <div class="stat-info">
                      <span class="stat-number">0</span>
                      <span class="stat-label">Tournaments</span>
                    </div>
                    <div class="stat-detail"><span class="stat-muted">Create one!</span></div>
                  </div>
                `}
              </div>
            </div>
            
            <!-- Activity Summary Section -->
            <div class="dashboard-activity">
              <h3 class="activity-title">📊 Quick Summary</h3>
              <div class="activity-cards">
                ${dashboardStats.gymLog.recentWorkout ? `
                  <div class="activity-card">
                    <div class="activity-header">
                      <span class="activity-icon">🏋️</span>
                      <span class="activity-type">Last Workout</span>
                    </div>
                    <div class="activity-content">
                      <strong>${dashboardStats.gymLog.recentWorkout.exercise}</strong>
                      <span class="activity-meta">${dashboardStats.gymLog.recentWorkout.sets}×${dashboardStats.gymLog.recentWorkout.reps} @ ${dashboardStats.gymLog.recentWorkout.weight} lbs</span>
                      <span class="activity-time">${formatRelativeDate(dashboardStats.gymLog.recentWorkout.date)}</span>
                    </div>
                  </div>
                ` : ''}
                
                ${dashboardStats.focusTimer.activeTasks > 0 ? `
                  <div class="activity-card">
                    <div class="activity-header">
                      <span class="activity-icon">📋</span>
                      <span class="activity-type">Tasks</span>
                    </div>
                    <div class="activity-content">
                      <strong>${dashboardStats.focusTimer.activeTasks} active</strong>
                      ${dashboardStats.focusTimer.overdueTasks > 0 ? `<span class="activity-warning">⚠️ ${dashboardStats.focusTimer.overdueTasks} overdue</span>` : ''}
                      <span class="activity-meta">${dashboardStats.focusTimer.weeklyFormatted} this week</span>
                    </div>
                  </div>
                ` : ''}
                
                ${dashboardStats.counters.topCounter ? `
                  <div class="activity-card">
                    <div class="activity-header">
                      <span class="activity-icon">🔥</span>
                      <span class="activity-type">Top Counter</span>
                    </div>
                    <div class="activity-content">
                      <strong>${dashboardStats.counters.topCounter.name}</strong>
                      <span class="activity-meta">${dashboardStats.counters.topCounter.value}${dashboardStats.counters.topCounter.goal ? ` / ${dashboardStats.counters.topCounter.goal}` : ''}</span>
                    </div>
                  </div>
                ` : ''}
              </div>
            </div>

            <!-- Mini App Cards -->
            <h3 class="section-title">🚀 Quick Access</h3>
            <div class="personal-landing-grid">
              <button class="personal-landing-card" data-route="#/personal/gym-log" type="button">
                <div class="card-icon">🏋️</div>
                <div class="card-body">
                  <h2>Gym Log</h2>
                  <p>Track workouts, volume, and progress over time.</p>
                </div>
              </button>
              <button class="personal-landing-card" data-route="#/personal/tournament" type="button">
                <div class="card-icon">🏆</div>
                <div class="card-body">
                  <h2>Tournament</h2>
                  <p>Create brackets and record match results.</p>
                </div>
              </button>
              <button class="personal-landing-card" data-route="#/personal/counter" type="button">
                <div class="card-icon">🔢</div>
                <div class="card-body">
                  <h2>Counters</h2>
                  <p>Track reps, sets, or any custom counts.</p>
                </div>
              </button>
              <button class="personal-landing-card" data-route="#/personal/focus-timer" type="button">
                <div class="card-icon">⏱️</div>
                <div class="card-body">
                  <h2>Focus Timer</h2>
                  <p>Manage tasks with productivity timers and track your time.</p>
                  </div>
              </button>
              <button class="personal-landing-card" data-route="#/personal/screener" type="button">
                <div class="card-icon">📈</div>
                <div class="card-body">
                  <h2>Stock Screener</h2>
                  <p>S&amp;P 500 stocks ranked weekly against three investor strategies.</p>
                </div>
              </button>
            </div>
          </section>
        `;
        
        // Add click handlers to make entire cards clickable
        const cards = appContent.querySelectorAll('.personal-landing-card');
        cards.forEach(card => {
          card.addEventListener('click', (e) => {
            const route = card.getAttribute('data-route');
            if (route) {
              router.navigate(route);
            }
          });
        });
        
        updateActiveNav('nav-personal-home');
      });
      
      // Helper function to load dashboard stats from all mini sites
      async function loadDashboardStats() {
        const stats = {
          gymLog: { totalWorkouts: 0, thisWeek: 0, recentWorkout: null },
          focusTimer: { totalSessions: 0, todayTime: 0, todayFormatted: '0m', weeklyTime: 0, weeklyFormatted: '0m', activeTasks: 0, overdueTasks: 0 },
          counters: { total: 0, totalValue: 0, goalsCompleted: 0, topCounter: null },
          tournaments: { total: 0, inProgress: 0 }
        };
        
        try {
          // Load gym log data
          const workouts = await api.getWorkouts();
          if (workouts && workouts.length > 0) {
            stats.gymLog.totalWorkouts = workouts.length;
            
            // Calculate workouts this week
            const weekAgo = new Date();
            weekAgo.setDate(weekAgo.getDate() - 7);
            stats.gymLog.thisWeek = workouts.filter(w => new Date(w.date) >= weekAgo).length;
            
            // Get most recent workout
            const sorted = [...workouts].sort((a, b) => new Date(b.date) - new Date(a.date));
            stats.gymLog.recentWorkout = sorted[0];
          }
        } catch (e) { console.warn('Could not load gym stats:', e); }
        
        try {
          // Load focus timer data
          const focusData = await api.getFocusTimer();
          if (focusData) {
            const tasks = focusData.tasks || [];
            const sessions = focusData.sessions || [];
            
            stats.focusTimer.totalSessions = sessions.length;
            stats.focusTimer.activeTasks = tasks.filter(t => !t.completed).length;
            stats.focusTimer.overdueTasks = tasks.filter(t => {
              if (t.completed || !t.dueDate) return false;
              return new Date(t.dueDate) < new Date();
            }).length;
            
            // Calculate today's focus time
            const todayStr = new Date().toISOString().split('T')[0];
            const todaySessions = sessions.filter(s => {
              const sessionDate = new Date(s.startTime).toISOString().split('T')[0];
              return sessionDate === todayStr;
            });
            stats.focusTimer.todayTime = todaySessions.reduce((sum, s) => sum + s.duration, 0);
            stats.focusTimer.todayFormatted = formatDuration(stats.focusTimer.todayTime);
            
            // Calculate weekly focus time
            const weekAgo = new Date();
            weekAgo.setDate(weekAgo.getDate() - 7);
            const weeklySessions = sessions.filter(s => new Date(s.startTime) >= weekAgo);
            stats.focusTimer.weeklyTime = weeklySessions.reduce((sum, s) => sum + s.duration, 0);
            stats.focusTimer.weeklyFormatted = formatDuration(stats.focusTimer.weeklyTime);
          }
        } catch (e) { console.warn('Could not load focus timer stats:', e); }
        
        try {
          // Load counter data
          const counterData = await api.getCounters();
          if (counterData && counterData.counters) {
            const counters = counterData.counters;
            stats.counters.total = counters.length;
            stats.counters.totalValue = counters.reduce((sum, c) => sum + c.value, 0);
            stats.counters.goalsCompleted = counters.filter(c => c.goal > 0 && c.value >= c.goal).length;
            
            // Find top counter by value
            if (counters.length > 0) {
              stats.counters.topCounter = counters.reduce((max, c) => c.value > (max?.value || 0) ? c : max, null);
            }
          }
        } catch (e) { console.warn('Could not load counter stats:', e); }
        
        try {
          // Load tournament data
          const tournaments = await api.getTournaments();
          if (tournaments && tournaments.length > 0) {
            stats.tournaments.total = tournaments.length;
            stats.tournaments.inProgress = tournaments.filter(t => !t.winner).length;
          }
        } catch (e) { console.warn('Could not load tournament stats:', e); }
        
        return stats;
      }
      
      // Helper function to format duration in seconds
      function formatDuration(seconds) {
        const hours = Math.floor(seconds / 3600);
        const mins = Math.floor((seconds % 3600) / 60);
        
        if (hours > 0) {
          return `${hours}h ${mins}m`;
        } else if (mins > 0) {
          return `${mins}m`;
        } else {
          return '0m';
        }
      }
      
      // Helper function to format relative dates
      function formatRelativeDate(dateStr) {
        const date = new Date(dateStr);
        const now = new Date();
        const diffDays = Math.floor((now - date) / (1000 * 60 * 60 * 24));
        
        if (diffDays === 0) return 'Today';
        if (diffDays === 1) return 'Yesterday';
        if (diffDays < 7) return `${diffDays} days ago`;
        if (diffDays < 30) return `${Math.floor(diffDays / 7)} weeks ago`;
        return date.toLocaleDateString();
      }

      router.register('/personal/gym-log', () => {
        document.getElementById('app-content').innerHTML = '<div id="gym-log-content"></div>';
        updateActiveNav('nav-gym-log');
        // Reload data from current source (Supabase or localStorage) then render
        gymLog.init();
      });

      router.register('/personal/tournament', () => {
        document.getElementById('app-content').innerHTML = '<div id="tournament-content"></div>';
        updateActiveNav('nav-tournament');
        tournament.init();
      });

      router.register('/personal/counter', () => {
        document.getElementById('app-content').innerHTML = '<div id="counter-content"></div>';
        updateActiveNav('nav-counter');
        counter.init();
      });

      router.register('/personal/focus-timer', () => {
        document.getElementById('app-content').innerHTML = '<div id="focus-timer-content"></div>';
        updateActiveNav('nav-focus-timer');
        focusTimer.init();
      });

      router.register('/personal/screener', () => {
        document.getElementById('app-content').innerHTML = '<div id="screener-content"></div>';
        updateActiveNav('nav-screener');
        screener.init();
      });
      
      // Handle direct access to personal.html (no hash)
      if (!window.location.hash && window.location.pathname.includes('personal')) {
        router.navigate('#/personal', true);
      }

      router.setNotFound(() => {
        const appContent = document.getElementById('app-content');
        appContent.innerHTML = `
          <div style="text-align:center; padding:60px 20px;">
            <h2>404 - Page Not Found</h2>
            <p style="color:var(--muted); margin:16px 0 24px;">The page you're looking for doesn't exist.</p>
            <a href="#" data-route="#/personal" class="btn primary">Go to Personal Overview</a>
          </div>
        `;
      });

      // Handle initial route
      router.handleRoute();
    }

    // Update active navigation
    function updateActiveNav(activeId) {
      document.querySelectorAll('.personal-nav-links a').forEach(link => {
        link.classList.remove('active');
      });
      const activeLink = document.getElementById(activeId);
      if (activeLink) {
        activeLink.classList.add('active');
      }
    }

    // Make router and auth available globally for onclick handlers
    window.router = router;
    window.auth = auth;
    window.gymLog = gymLog;
    window.tournament = tournament;
    window.counter = counter;
    window.focusTimer = focusTimer;
  </script>
</body>
</html>
